<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Password | Frame Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .password-box {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 25px;
        }
        input[type="password"] {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="password"]:focus {
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.02);
        }
        .error {
            color: #e74c3c;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="password-box">
        <h2>🔒 Frame Generator</h2>
        <p>Enter password to continue</p>
        <input type="password" id="passwordInput" placeholder="Type your password...">
        <button onclick="checkPassword()">Unlock</button>
        <div class="error" id="errorMsg">❌ Wrong password! Try again.</div>
    </div>

    <script>
        // CHANGE YOUR PASSWORD HERE ↓
        const CORRECT_PASSWORD = "nikko123"; 

        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            if (input === CORRECT_PASSWORD) {
                // Go to your main page (change filename if needed)
                window.location.href = "generator.html";
            } else {
                document.getElementById('errorMsg').style.display = "block";
                document.getElementById('passwordInput').value = "";
            }
        }
        
        // Allow Enter key to submit
        document.getElementById('passwordInput').addEventListener("keypress", function(e) {
            if (e.key === "Enter") checkPassword();
        });
    </script>
</body>
</html>
